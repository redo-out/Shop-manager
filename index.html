<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="p-4 sm:p-6 lg:p-10 bg-slate-50">
    <header>
      <nav
        class="bg-slate-900 flex flex-wrap justify-between items-center rounded-xl"
      >
        <div
          class="flex flex-col items-center gap-6 p-7 md:flex-row md:gap-8 rounded-2xl"
        >
          <h1 class="font-serif text-base text-white">
            Shop<span class="text-indigo-400">Manager</span>
          </h1>
        </div>
        <div class="flex">
          <div
            class="border-4 border-indigo-900 h-10 w-10 bg-indigo-900 rounded-full"
          ></div>
          <div
            class="border-4 border-red-900 h-10 w-10 bg-red-900 rounded-full relative right-4"
          ></div>
          <div
            class="border-4 border-yellow-900 bg-yellow-900 h-10 w-10 rounded-full relative right-8"
          ></div>
        </div>
      </nav>
    </header>
    <main>
      <section class="flex flex-col lg:flex-row gap-4 pt-4 pb-4">
        <div class="flex flex-col sm:flex-row flex-1 gap-2">
          <input id="product-search-by-title"
            class="w-full sm:flex-[2] min-w-0 p-4 text-white bg-black rounded-2xl"
            type="text"
            placeholder="Entrer le nom du produit ou la description"
          />
          <input id="product-search-by-price"
            class="w-full sm:flex-1 min-w-0 p-4 text-white bg-black rounded-2xl"
            type="number"
            placeholder="des produits d'une valeur égale ou inférieure à ce prix"/>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 lg:w-1/3">
            <button id="button-categorie" class="w-full rounded-xl p-3 bg-indigo-600 text-white hover:bg-indigo-700">Catégorie</button>
            <button id="button-disponible" class="w-full rounded-xl p-3 bg-indigo-600 text-white hover:bg-indigo-700">disponibles</button>
            <button id="button-reinitialiser" class="w-full rounded-xl p-3 bg-indigo-600 text-white hover:bg-indigo-700">réinitialiser</button>
        </div>
      </section>
      <hr>
      <ul id="product-placeholder" class="grid grid-cols-[repeat(auto-fill,minmax(200px,1fr))] gap-4 pt-5 items-center justify-evenly">
       
      </ul>
    </main>
    <script src="JS/script.js"></script>
  </body>
</html>
