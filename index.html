<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="p-4 sm:p-6 lg:p-10 bg-slate-50">
    <header>
      <nav
        class="bg-slate-900 flex flex-wrap justify-between items-center rounded-xl"
      >
        <div
          class="flex flex-col items-center gap-6 p-7 md:flex-row md:gap-8 rounded-2xl"
        >
          <h1 class="font-serif text-base text-white">
            Shop<span class="text-indigo-400">Manager</span>
          </h1>
        </div>
        <div class="flex">
          <div
            class="border-4 border-indigo-900 h-10 w-10 bg-indigo-900 rounded-full"
          ></div>
          <div
            class="border-4 border-red-900 h-10 w-10 bg-red-900 rounded-full relative right-4"
          ></div>
          <div
            class="border-4 border-yellow-900 bg-yellow-900 h-10 w-10 rounded-full relative right-8"
          ></div>
          <div class="pr-8">
            <button id="cart-button">
              <img class="w-10" src="icon/cart.svg" alt="cart" />
            </button>
          </div>
        </div>
      </nav>
    </header>
    <main>
      <dialog
        id="dialog"
        class="w-[90%] max-w-4xl max-h-[85vh] p-0 rounded-xl bg-slate-900 text-white
         backdrop:bg-black/70 border border-slate-700 overflow-y-auto">
        <div class="flex justify-between items-center p-5 border-b border-slate-700">
          <h2 class="text-xl font-bold">Checkout</h2>
          <button type="button" id="close-dialog" class="text-slate-400 hover:text-white text-2xl">Close</button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 p-6">
          <form id="checkout-form" class="flex flex-col gap-4">
            <h3 class="text-lg font-semibold">Customer Information</h3>
            <div class="flex flex-col gap-1">
              <label for="customer-name">Full Name</label>
              <input type="text" id="customer-name" name="customerName" placeholder="Enter your full name" required
                class="p-3 rounded-lg bg-slate-800 border border-slate-600 outline-none focus:border-blue-500"/>
            </div>
            <div class="flex flex-col gap-1">
              <label for="customer-email">Email</label>
              <input type="email" id="customer-email" name="customerEmail" placeholder="Enter your email" required
                class="p-3 rounded-lg bg-slate-800 border border-slate-600 outline-none focus:border-blue-500"/>
            </div>
            <div class="flex flex-col gap-1">
              <label for="customer-phone">Phone Number</label>
              <input type="tel" id="customer-phone" name="customerPhone" placeholder="Enter your phone number" required
                class="p-3 rounded-lg bg-slate-800 border border-slate-600 outline-none focus:border-blue-500"/>
            </div>
            <div class="flex flex-col gap-1">
              <label for="customer-address">Delivery Address</label>
              <textarea id="customer-address" name="customerAddress" rows="2"  placeholder="Enter your delivery address" required
                class="p-3 rounded-lg bg-slate-800 border border-slate-600 outline-none focus:border-blue-500 resize-none"></textarea>
            </div>
            <button type="submit" class="mt-2 p-3 rounded-lg bg-blue-600 hover:bg-blue-700 font-semibold transition">
              Confirm Order
            </button>
          </form>
          <div class="flex flex-col gap-4">
            <h3 class="text-lg font-semibold">Order Summary</h3>
            <ul id="carts-placeholder" class="flex flex-col gap-3">
              

            </ul>
            <div class="border-t border-slate-700 pt-4 flex justify-between items-center">
              <span class="font-semibold">Total</span>
              <span id="checkout-total" class="text-xl font-bold text-blue-400"></span>
              <span class="font-semibold">Products</span>
              <span id="product-selected" class="text-xl font-bold text-blue-400"></span>
            </div>
          </div>
        </div>
      </dialog>
      <section class="flex flex-col lg:flex-row gap-4 pt-4 pb-4">
        <div id="inputs" class="flex flex-col sm:flex-row flex-1 gap-2">
          <input
            id="product-search-by-title"
            class="input-title w-full sm:flex-[2] min-w-0 p-4 text-white bg-black rounded-2xl"
            type="text"
            placeholder="Entrer le nom du produit ou la description"
          />
          <input
            id="product-search-by-price"
            class="input-price w-full sm:flex-1 min-w-0 p-4 text-white bg-black rounded-2xl"
            type="number"
            placeholder="des produits d'une valeur égale ou inférieure à ce prix"
          />
        </div>
        <div
          class="grid grid-cols-1 sm:grid-cols-3 gap-2 lg:w-1/3"
          id="buttons"
        >
          <select
            class="select-category w-full rounded-xl p-3 bg-indigo-600 text-white hover:bg-indigo-700"
          >
            <option id="disabledOption" value="" selected disabled>
              categories
            </option>
          </select>

          <button
            class="button-disponible w-full rounded-xl p-3 bg-indigo-600 text-white hover:bg-indigo-700"
          >
            disponibles
          </button>
          <button
            class="button-reinitialiser w-full rounded-xl p-3 bg-indigo-600 text-white hover:bg-indigo-700"
          >
            réinitialiser
          </button>
        </div>
      </section>
      <hr />
      <ul
        id="product-placeholder"
        class="grid grid-cols-[repeat(auto-fill,minmax(200px,1fr))] gap-4 pb-5 pt-5 items-center justify-evenly"
      ></ul>
    </main>
    <script src="JS/script.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.all.min.js"></script>
  </body>
</html>
